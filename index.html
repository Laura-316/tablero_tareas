<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Planificador de Tareas</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="contenedor-principal">
        
        <span class="titulo-seccion">Mi Planificador</span>

        <!-- Campo 1: Tarea a realizar -->
        <div class="campo-formulario">
            <span class="etiqueta">Tarea a realizar:</span>
            <input type="text" id="input-nombre-tarea" class="entrada-texto">
        </div>


        <!-- Campo 2: Estado de la tarea -->
        <div class="campo-formulario">
            <span class="etiqueta">Estado de la tarea:</span>
            <select id="select-estado" class="entrada-texto">
                <option value="">Seleccione...</option>
                <option value="por-hacer">Por hacer</option>
                <option value="en-proceso">En proceso</option>
                <option value="entregado">Entregado</option>
            </select>
        </div>

        <!-- Campo 3: Fecha de entrega -->
        <div class="campo-formulario">
            <span class="etiqueta">Fecha de entrega:</span>
            <input type="date" id="input-fecha" class="entrada-texto">
        </div>

        
        <!-- Campo 4: Asignado a -->
        <div class="campo-formulario">
            <span class="etiqueta">Asignado a:</span>
            <input type="text" id="input-asignado" class="entrada-texto">
        </div>

        <!-- Botón de guardado -->
        <button id="boton-guardar" class="boton-guardar">Guardar Tarea</button>

        <!-- Contenedor de lista -->
        <div class="contenedor-lista">
            <span class="subtitulo-seccion">Tareas Registradas</span>
            <div id="contenedor-tarjetas"></div>
        </div>

    </div>
     <script src="./TaskManager.js"></script>
    <script src="./script.js"></script>
</body>
</html>
